name: build
on:
  push:
    branches: [main]
  pull_request:
# CI only — no image publishing. Releases (versioned images + binaries) are
# handled by release-please.yml, and only on tagged releases.

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go build ./...

  docker-build:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false          # build-check only; never publish from main/PR
